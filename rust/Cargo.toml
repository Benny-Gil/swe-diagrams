[package]
name = "swe-diagrams"
version = "0.1.0"
edition = "2021"
description = "Fast diagrams of software, written by agents in a compact language"
license = "MIT"
repository = "https://github.com/Benny-Gil/swe-diagrams"
readme = "../README.md"
keywords = ["diagram", "svg", "architecture", "agent", "cli"]
categories = ["command-line-utilities", "visualization"]
# The tests read files in ../spec, so the crate does not include them.
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[lib]
name = "swe_diagrams"
path = "src/lib.rs"

[[bin]]
name = "swe-diagrams"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

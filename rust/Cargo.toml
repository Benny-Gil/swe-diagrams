[package]
name = "swe-diagrams"
version = "0.1.0"
edition = "2021"
description = "Fast diagrams of software, written by agents in a compact language"
license = "MIT"
repository = "https://github.com/Benny-Gil/swe-diagrams"
readme = "../README.md"
keywords = ["diagram", "svg", "architecture", "agent", "cli"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "swe_diagrams"
path = "src/lib.rs"

[[bin]]
name = "swe-diagrams"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
color_quant = "1.1"
gif = "0.14"
resvg = { version = "0.50.0", default-features = false, features = ["text", "raster-images"] }
terminal_size = "0.4"

# The rasterizer is slow without optimization, and the tests draw each fixture.
[profile.dev.package."*"]
opt-level = 3

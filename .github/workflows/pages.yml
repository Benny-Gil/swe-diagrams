# Publishes the folder `site/` to GitHub Pages when it changes on main.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # These files go into llms-full.txt.
      - "README.md"
      - "docs/install.md"
      - "skills/swe-diagrams/SKILL.md"
      - "skills/swe-diagrams/references/language.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Language models read one file instead of four links.
      - name: Make llms-full.txt
        run: |
          for f in README.md docs/install.md skills/swe-diagrams/SKILL.md skills/swe-diagrams/references/language.md; do
            printf '<!-- %s -->\n\n' "$f"
            cat "$f"
            printf '\n\n'
          done > site/llms-full.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
